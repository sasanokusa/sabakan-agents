[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sabakan-agent"
version = "0.1.0"
description = "Fail-closed broker for a local-LLM server management agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sabakanctl = "sabakan_broker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
